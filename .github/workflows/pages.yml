name: Test, publish Docker Hub image and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_REPOSITORY: jiojiojackson/web-wechat
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Public source and shell validation
        run: |
          python3 scripts/check-public.py
          for script in install.sh deploy/*.sh; do bash -n "$script"; done
          shellcheck install.sh deploy/*.sh
      - name: Authentication and installer safety tests
        run: |
          python3 -m venv /tmp/wechat-web-tests
          /tmp/wechat-web-tests/bin/pip install -r tests/requirements.txt
          /tmp/wechat-web-tests/bin/python -m unittest discover -s tests -p test_access_guard.py -v
          /tmp/wechat-web-tests/bin/python -m unittest discover -s tests -p test_installer.py -v
          /tmp/wechat-web-tests/bin/python -m unittest discover -s tests -p test_bootstrap.py -v
          /tmp/wechat-web-tests/bin/python -m unittest discover -s tests -p test_package.py -v
          /tmp/wechat-web-tests/bin/python -m unittest discover -s tests -p test_terminal.py -v
          /tmp/wechat-web-tests/bin/python -m unittest discover -s tests -p test_wait_ready.py -v
  containers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Build hardened native image
        run: docker build --pull --label org.opencontainers.image.source=https://github.com/jiojiojackson/wechat-web --label org.opencontainers.image.revision=${{ github.sha }} -t wechat-web:ci deploy
      - name: Run isolated authentication and gateway tests
        run: python3 scripts/test-container.py --image wechat-web:ci
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested native image
        if: github.event_name != 'pull_request'
        run: |
          docker tag wechat-web:ci "$IMAGE_REPOSITORY:sha-$GITHUB_SHA-${{ matrix.arch }}"
          docker push "$IMAGE_REPOSITORY:sha-$GITHUB_SHA-${{ matrix.arch }}"
  publish:
    if: github.event_name != 'pull_request'
    needs: containers
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Publish multi-platform image
        id: manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_REPOSITORY:sha-$GITHUB_SHA" -t "$IMAGE_REPOSITORY:latest" \
            "$IMAGE_REPOSITORY:sha-$GITHUB_SHA-amd64" "$IMAGE_REPOSITORY:sha-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_REPOSITORY:sha-$GITHUB_SHA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
  build:
    if: github.event_name != 'pull_request'
    needs: [test, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node.js 24)
      - run: python3 scripts/build-pages.py _site
        env:
          WECHAT_RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node.js 24 upload-artifact)
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node.js 24)
