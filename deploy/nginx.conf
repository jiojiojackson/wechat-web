server {
    listen 3000 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/selkies/web;
    index index.html;
    autoindex off;
    auth_request /_access_verify;
    auth_request_set $wechat_session_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $wechat_session_cookie always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 100m;
    client_body_timeout 30s;

    location = /_access_verify {
        internal;
        auth_request off;
        auth_basic off;
        proxy_pass http://127.0.0.1:8090/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        auth_request off;
        auth_basic off;
        access_log off;
        try_files /healthz.txt =503;
    }
    location ~ ^/websockets?$ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /files/ {
        alias /config/Desktop/;
        fancyindex on;
        fancyindex_footer /nginx/footer.html;
        fancyindex_header /nginx/header.html;
        disable_symlinks on;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        add_header Set-Cookie $wechat_session_cookie always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        if (-f $request_filename) {
            add_header Content-Disposition attachment always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "private, no-store" always;
            add_header Set-Cookie $wechat_session_cookie always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        }
    }
    location = /files { rewrite ^ /files/ last; }
    location / { try_files $uri $uri/ =404; }
    location /devmode { return 404; }
    location ~ /\. { deny all; }
}
